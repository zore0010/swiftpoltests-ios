name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch pinned quiz sources
        run: bash scripts/fetch-sources.sh Web

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project SwiftPolTest.xcodeproj \
            -scheme SwiftPolTest \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project SwiftPolTest.xcodeproj \
            -scheme SwiftPolTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SwiftPolTest.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= 2>&1 | tee build/archive.log

      - name: Package unsigned IPA
        run: bash scripts/package-ipa.sh build/SwiftPolTest.xcarchive build/SwiftPolTest-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPolTest-unsigned-ipa
          path: build/SwiftPolTest-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Show errors on the run summary page
        if: failure()
        run: |
          {
            echo "## Build failed: errors from the logs"
            echo
            echo '```'
            for f in build/test.log build/archive.log; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                grep -E 'error:|failed|FAILED|fatal' "$f" | head -150 || true
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
