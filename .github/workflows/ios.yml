name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch pinned quiz sources
        run: bash scripts/fetch-sources.sh Web

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project WKWVTests.xcodeproj \
            -scheme WKWVTests \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project WKWVTests.xcodeproj \
            -scheme WKWVTests \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WKWVTests.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=

      - name: Package unsigned IPA
        run: bash scripts/package-ipa.sh build/WKWVTests.xcarchive build/WKWVTests-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WKWVTests-unsigned-ipa
          path: build/WKWVTests-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
