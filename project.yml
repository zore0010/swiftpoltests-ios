name: SwiftPolTest

options:
  bundleIdPrefix: com.zore
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Team ID here only if you sign builds in Xcode.
    DEVELOPMENT_TEAM: ""

targets:
  SwiftPolTest:
    type: application
    platform: iOS
    sources:
      - path: App
      # Built by scripts/fetch-sources.sh before xcodegen runs.
      - path: Web
        type: folder
        excludes:
          - "**/.git"
          - "**/.DS_Store"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Political Tests
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Shows the Political Tests folder (saved results) in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        # Kept from the earlier builds, so the app keeps its saved data on the phone.
        PRODUCT_BUNDLE_IDENTIFIER: com.zore.wkwvtests
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  SwiftPolTestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SwiftPolTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zore.wkwvtests.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwiftPolTest.app/SwiftPolTest"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SwiftPolTest:
    build:
      targets:
        SwiftPolTest: all
        SwiftPolTestTests: [test]
    test:
      targets:
        - SwiftPolTestTests
